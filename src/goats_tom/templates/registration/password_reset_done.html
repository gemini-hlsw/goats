{% extends 'tom_common/base.html' %}
{% block title %}Check your email{% endblock %}
{% block content %}
<div class="row justify-content-md-center">
  <div class="col-md-6 col-lg-4">
    <h1 class="h2 mb-3">Check your email</h1>
    <p>If an account uses that address, we have sent it a link to choose a new password. The link works once.</p>
    <p class="mb-0">Nothing arrived? Check your spam folder, or <a href="{% url 'password_reset' %}">try again</a>.</p>
  </div>
</div>
{% endblock %}

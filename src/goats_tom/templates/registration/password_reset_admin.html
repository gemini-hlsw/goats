{% extends 'tom_common/base.html' %}
{% block title %}Reset your password{% endblock %}
{% block content %}
<div class="row justify-content-md-center">
  <div class="col-md-6 col-lg-4">
    <h1 class="h2 mb-3">
      Reset your password
      <a
        class="link-primary ms-1 fs-6 align-middle"
        type="button"
        tabindex="0"
        id="admin-reset-info"
        data-bs-toggle="popover"
        data-bs-placement="right"
        data-bs-trigger="focus"
        data-bs-title="Reset your password"
        data-bs-content="An administrator reviews the request and gives you a temporary password. You choose a new one when you sign in with it."
        ><i class="fa-solid fa-circle-info"></i
      ></a>
    </h1>
    <script>
      new bootstrap.Popover(document.getElementById("admin-reset-info"));
    </script>
    <form method="post">
      {% csrf_token %}
      {% include 'partials/form_fields.html' with fields=form %}
      <button type="submit" class="btn btn-primary">Send request</button>
    </form>
    <p class="mt-4 mb-0"><a href="{% url 'login' %}">Back to sign in</a></p>
  </div>
</div>
{% endblock %}

{% load static bootstrap4 %}

<div class="position-relative text-center py-0 small subpixel-antialiased">
  <p class="banner-slogan mb-0">
    Time-domain astronomy made time efficient.
  </p>
  {% if version_info.is_outdated %}
  <div class="position-absolute top-0 end-0 me-3 text-body-secondary" title="New GOATS version available: {{ version_info.latest }}">
    <i class="fa-solid fa-triangle-exclamation fa-fade" style="--fa-animation-duration: 2s"></i> <span class="d-md-inline d-none">New version available: <span class="font-monospace">{{ version_info.latest }}</span></span>
  </div>
  {% endif %}
</div>
